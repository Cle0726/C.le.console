name: AWS Quick tests

on:
  push:
    branches:
      - main
      - 'feat/aws-quick*'
    paths:
      - 'sidecars/aws-quick/**'
      - 'third_party/magpie-aws-quick-bridge/**'
      - 'src-tauri/src/modules/aws_quick.rs'
      - 'src-tauri/src/modules/multi_model_api.rs'
      - '.github/workflows/aws-quick-tests.yml'
  pull_request:
    paths:
      - 'sidecars/aws-quick/**'
      - 'third_party/magpie-aws-quick-bridge/**'
      - 'src-tauri/src/modules/aws_quick.rs'
      - 'src-tauri/src/modules/multi_model_api.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway and pool (node, bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Pool policy
        run: node --test sidecars/aws-quick/pool-policy.test.mjs
      - name: Bridge
        working-directory: third_party/magpie-aws-quick-bridge
        # unit/e2e need the upstream package's index.mjs, which is not vendored
        run: bun test test/gateway.test.mjs test/cle-fixes.test.mjs test/organization.test.mjs
      - name: Sidecar bundles
        run: npx --yes esbuild@0.25.10 sidecars/aws-quick/entry.mjs --bundle --platform=node --format=cjs --target=node22 --outfile=/tmp/cle-aws-quick.cjs

  console:
    name: Console routes (cargo test)
    # a Tauri lib test binary does not start on Windows without the app's
    # manifest (STATUS_ENTRYPOINT_NOT_FOUND); macOS runs it as it is
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Compile-only sidecar placeholders
        run: |
          for bin in cle-cliproxy/bin/cle-cliproxy cockpit-cliproxy/bin/cockpit-cliproxy jimeng-api/bin/jimeng-api aws-quick/bin/cle-aws-quick mihomo/bin/mihomo; do
            mkdir -p "sidecars/$(dirname "$bin")"
            touch "sidecars/${bin}-aarch64-apple-darwin"
          done
      - name: AWS Quick and multi-model tests
        env:
          CLE_SKIP_CLIPROXY_BUILD: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- aws_quick multi_model_api
