name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: storyos/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit StoryOS desktop read-only boundary
        run: node scripts/check-storyos-desktop-bridge.mjs

      - name: Audit StoryOS manuscript writer boundary
        run: node scripts/check-storyos-manuscript-writer.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Install StoryOS desktop packager
        run: python -m pip install -e "storyos[desktop]"

      - name: Build StoryOS Windows read-only sidecar
        run: python scripts/build-storyos-sidecar.py --target x86_64-pc-windows-msvc

      - name: Build StoryOS Windows manuscript sidecar
        run: python scripts/build-storyos-manuscript-sidecar.py --target x86_64-pc-windows-msvc

      - name: Prepare compile-only sidecar placeholders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'sidecars/cle-cliproxy/bin/cle-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/jimeng-api/bin/jimeng-api-x86_64-pc-windows-msvc.exe'
          )

          foreach ($path in $paths) {
            $directory = Split-Path -Parent $path
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            New-Item -ItemType File -Force -Path $path | Out-Null
          }

          Write-Host 'Created compile-only placeholders for non-StoryOS sidecars. Both StoryOS sidecars are built and smoke-tested for real in PR CI.'

      - name: Rust compile check
        env:
          CLE_SKIP_CLIPROXY_BUILD: '1'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
