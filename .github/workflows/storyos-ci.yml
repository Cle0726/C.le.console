name: StoryOS CI

on:
  push:
    paths:
      - "storyos/**"
      - ".github/workflows/storyos-ci.yml"
  pull_request:
    paths:
      - "storyos/**"
      - ".github/workflows/storyos-ci.yml"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: storyos/pyproject.toml

      - name: Install StoryOS
        run: python -m pip install -e "storyos[dev]"

      - name: Run StoryOS tests
        run: python -m pytest storyos/tests -q
