name: Prepare release 1.1.5

on:
  push:
    branches:
      - release/v1.1.5

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prep-generated]') }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/v1.1.5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump npm package version
        shell: pwsh
        run: npm version 1.1.5 --no-git-tag-version

      - name: Synchronize Tauri and Cargo versions
        shell: pwsh
        run: npm run sync-version

      - name: Prepare compile-only sidecar placeholders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'sidecars/cle-cliproxy/bin/cle-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/jimeng-api/bin/jimeng-api-x86_64-pc-windows-msvc.exe'
          )
          foreach ($path in $paths) {
            $directory = Split-Path -Parent $path
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            New-Item -ItemType File -Force -Path $path | Out-Null
          }

      - name: Refresh Cargo.lock
        shell: pwsh
        env:
          CLE_SKIP_CLIPROXY_BUILD: '1'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit synchronized release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml Cargo.lock
          if (git diff --cached --quiet) {
            Write-Host 'No release version changes to commit.'
            exit 0
          }
          git commit -m 'chore: prepare v1.1.5 [release-prep-generated]'
          git push origin HEAD:release/v1.1.5
