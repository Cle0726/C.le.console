name: AWS Quick tests

on:
  push:
    branches:
      - main
      - 'feat/aws-quick*'
    paths:
      - 'sidecars/aws-quick/**'
      - 'third_party/magpie-aws-quick-bridge/**'
      - 'src-tauri/src/modules/aws_quick.rs'
      - 'src-tauri/src/modules/multi_model_api.rs'
      - '.github/workflows/aws-quick-tests.yml'
  pull_request:
    paths:
      - 'sidecars/aws-quick/**'
      - 'third_party/magpie-aws-quick-bridge/**'
      - 'src-tauri/src/modules/aws_quick.rs'
      - 'src-tauri/src/modules/multi_model_api.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway and pool (node, bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Pool policy
        run: node --test sidecars/aws-quick/pool-policy.test.mjs
      - name: Bridge
        working-directory: third_party/magpie-aws-quick-bridge
        # unit/e2e need the upstream package's index.mjs, which is not vendored
        run: bun test test/gateway.test.mjs test/cle-fixes.test.mjs test/organization.test.mjs
      - name: Sidecar bundles
        run: npx --yes esbuild@0.25.10 sidecars/aws-quick/entry.mjs --bundle --platform=node --format=cjs --target=node22 --outfile=/tmp/cle-aws-quick.cjs

  console:
    name: Console routes (cargo test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Compile-only sidecar placeholders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'sidecars/cle-cliproxy/bin/cle-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/jimeng-api/bin/jimeng-api-x86_64-pc-windows-msvc.exe',
            'sidecars/aws-quick/bin/cle-aws-quick-x86_64-pc-windows-msvc.exe',
            'sidecars/mihomo/bin/mihomo-x86_64-pc-windows-msvc.exe')) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            New-Item -ItemType File -Force -Path $path | Out-Null
          }
      - name: AWS Quick and multi-model tests
        env:
          CLE_SKIP_CLIPROXY_BUILD: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- aws_quick multi_model_api
