[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cle-storyos"
version = "0.1.0"
description = "Deterministic story state engine for long-form fiction"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
storyos = "storyos.cli:main"

[tool.setuptools]
packages = ["storyos"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
