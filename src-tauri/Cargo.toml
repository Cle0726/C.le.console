[package]
name = "cle-console"
version = "1.1.20"
description = "C.le.控制台"
authors = ["Cle0726"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

[lib]
name = "antigravity_cle_console_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.20"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "blocking", "multipart"] }
quick-xml = "0.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
minisign-verify = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"
thiserror = "2"
anyhow = "1.0"
sha2 = "0.10"
ring = "0.17"
rsa = "0.9"
serde_urlencoded = "0.7"
url = "2.5"
regex = "1"
rand = "0.8"
futures = "0.3"
sysinfo = "0.33"
libc = "0.2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
md5 = "0.7"
tiny_http = "0.12"
urlencoding = "2.1"
lazy_static = "1.5"
trash = "5"
reqwest_dav = "0.3.3"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

# VS Code Copilot token injection (Windows only)
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["block2"] }
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
block2 = "0.6.2"
# macOS 26+ Liquid Glass with a system vibrancy fallback for older macOS.
window-vibrancy = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"

[profile.release]
lto = false
codegen-units = 16
opt-level = 's'
strip = true
