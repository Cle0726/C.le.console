[package]
name = "cle-account-reliability-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.23.1", features = ["v4"] }
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem"] }
