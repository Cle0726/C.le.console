name: Windows test build

# An installer from a pull request, to try a change on a real machine before
# it is released. Runs only while the pull request has the "test-build"
# label; the installer is kept as a workflow artifact for 7 days and is never
# published or offered to the updater.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

env:
  TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  test-build-windows:
    name: Build Windows x64 test installer
    if: contains(github.event.pull_request.labels.*.name, 'test-build')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third_party/jimeng-api/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecars/cle-cliproxy/go.mod
          cache-dependency-path: sidecars/cle-cliproxy/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Set the updater public key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw 'Missing GitHub Actions secret: TAURI_UPDATER_PUBLIC_KEY' }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 30 | Set-Content $configPath -Encoding utf8

      - run: npm ci

      - name: Build Windows sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare-mihomo.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the pinned Mihomo sidecar' }
          New-Item -ItemType Directory -Force sidecars/cle-cliproxy/bin | Out-Null
          Push-Location sidecars/cle-cliproxy
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -buildvcs=false -trimpath -ldflags '-s -w' -o bin/cle-cliproxy-x86_64-pc-windows-msvc.exe .
          Pop-Location
          ./scripts/build-jimeng-sidecar.ps1
          node scripts/build-aws-quick-sidecar.mjs x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the AWS Quick sidecar' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'cle-console-portable-baseline'
          Expand-Archive release/C.le.console_1.1.4_x64_portable.zip $extractRoot -Force
          $source = Get-ChildItem $extractRoot -Recurse -File -Filter cockpit-cliproxy.exe | Select-Object -First 1
          if (-not $source) { throw 'cockpit-cliproxy.exe is missing from portable baseline' }
          New-Item -ItemType Directory -Force sidecars/cockpit-cliproxy/bin | Out-Null
          Copy-Item $source.FullName sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe -Force

      - name: Test sidecar adapters
        working-directory: sidecars/cle-cliproxy
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 .

      - run: npm run typecheck
      # Release-mode Rust tests embed frontendDist; a clean runner has no dist yet.
      - run: npm run build
      - name: Test subscription routing and update proxy
        shell: pwsh
        env:
          # The sidecar was built above; do not rebuild it for the test binary.
          CLE_SKIP_CLIPROXY_BUILD: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # The lib test executable carries no Windows application manifest, so
          # the dialog dependencies fail to load comctl32 v6 at start-up
          # (STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139). `cargo test` cannot add
          # the manifest to only that binary, so link it with `cargo rustc`
          # (rustc args apply to this one target) and run the executable.
          $dependency = "/MANIFESTDEPENDENCY:type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'"
          # Ask cargo where it put the executable: newer cargo no longer places it in
          # target/debug/deps. Diagnostics stay on stderr, stdout carries the artifacts.
          $messages = cargo rustc --locked -p cle-console --lib --profile test --message-format=json-render-diagnostics -- -C link-arg=/MANIFEST:EMBED -C "link-arg=$dependency"
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the lib test executable' }
          $exe = $messages | Where-Object { $_ -like '{*"reason":"compiler-artifact"*"executable":"*' } |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.profile.test -and $_.executable } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe -or -not (Test-Path $exe)) { throw "Lib test executable was not produced (cargo reported: $exe)" }
          Write-Host "Running $exe"
          foreach ($filter in 'modules::subscription_proxy::tests', 'app_updates::tests', 'modules::aws_quick::tests') {
            & $exe $filter --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $filter" }
          }
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: test-installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
