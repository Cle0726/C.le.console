name: Desktop signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    name: Build Windows x64 updater
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third_party/jimeng-api/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecars/cle-cliproxy/go.mod
          cache-dependency-path: sidecars/cle-cliproxy/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Verify release metadata and signing secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match package version v$version" }
          foreach ($name in 'TAURI_UPDATER_PUBLIC_KEY','TAURI_SIGNING_PRIVATE_KEY') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing GitHub Actions secret: $name" }
          }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 30 | Set-Content $configPath -Encoding utf8

      - run: npm ci

      - name: Build Windows sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force sidecars/cle-cliproxy/bin | Out-Null
          Push-Location sidecars/cle-cliproxy
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -buildvcs=false -trimpath -ldflags '-s -w' -o bin/cle-cliproxy-x86_64-pc-windows-msvc.exe .
          Pop-Location
          ./scripts/build-jimeng-sidecar.ps1
          $extractRoot = Join-Path $env:RUNNER_TEMP 'cle-console-portable-baseline'
          Expand-Archive release/C.le.console_1.1.4_x64_portable.zip $extractRoot -Force
          $source = Get-ChildItem $extractRoot -Recurse -File -Filter cockpit-cliproxy.exe | Select-Object -First 1
          if (-not $source) { throw 'cockpit-cliproxy.exe is missing from portable baseline' }
          New-Item -ItemType Directory -Force sidecars/cockpit-cliproxy/bin | Out-Null
          Copy-Item $source.FullName sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe -Force

      - run: npm run typecheck
      - name: Build signed Windows updater
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json --bundles nsis

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $sourceDir = 'target/release/bundle/nsis'; $out = 'artifacts/windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          $installer = Get-ChildItem $sourceDir -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer -or -not (Test-Path "$($installer.FullName).sig")) { throw 'Windows updater artifacts are incomplete' }
          Copy-Item $installer.FullName "$out/C.le.console_${version}_x64_setup.exe"
          Copy-Item "$($installer.FullName).sig" "$out/C.le.console_${version}_x64_setup.exe.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: artifacts/windows/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Apple Silicon updater
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third_party/jimeng-api/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecars/cle-cliproxy/go.mod
          cache-dependency-path: sidecars/cle-cliproxy/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Verify release metadata and inject updater public key
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY}" && test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          const macPath = 'src-tauri/tauri.macos.conf.json';
          const macConfig = JSON.parse(fs.readFileSync(macPath, 'utf8'));
          macConfig.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(macPath, `${JSON.stringify(macConfig, null, 2)}\n`);
          NODE

      - run: npm ci
      - run: npm run macos:check
      - name: Build signed Apple Silicon updater
        run: npm run macos:build

      - name: Stage macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ROOT='target/aarch64-apple-darwin/release/bundle'; OUT='artifacts/macos'
          mkdir -p "$OUT"
          DMG="$(find "$ROOT/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          ARCHIVE="$(find "$ROOT/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$DMG" && test -n "$ARCHIVE" && test -f "${ARCHIVE}.sig"
          cp "$DMG" "$OUT/C.le.console_${VERSION}_aarch64.dmg"
          cp "$ARCHIVE" "$OUT/C.le.console_${VERSION}_aarch64.app.tar.gz"
          cp "${ARCHIVE}.sig" "$OUT/C.le.console_${VERSION}_aarch64.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: artifacts/macos/*
          if-no-files-found: error

  publish:
    name: Publish desktop release and updater manifest
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate Chinese release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re

          version = json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version']
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'(?ms)^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)',
              changelog,
          )
          if not section or not section.group(1).strip():
              raise SystemExit(f'CHANGELOG.md 缺少 {version} 的中文更新内容')

          body = section.group(1).strip()
          notes = (
              f'# C.le.控制台 v{version}\n\n'
              '本版本同时提供 **Windows x64** 与 **macOS Apple Silicon（M1/M2/M3/M4）** 安装包。\n\n'
              f'{body}\n\n'
              '### 下载说明\n\n'
              f'- macOS Apple Silicon：下载 `C.le.console_{version}_aarch64.dmg`\n'
              f'- Windows x64：下载 `C.le.console_{version}_x64_setup.exe`\n'
              '- `SHA256SUMS.txt` 用于校验安装包完整性\n'
          )
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          print(notes)
          PY
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.parse
          root = pathlib.Path('release-assets')
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_REF_NAME']
          def asset(name):
              path = root / name
              if not path.is_file(): raise SystemExit(f'missing release asset: {path}')
              return path
          win = f'C.le.console_{version}_x64_setup.exe'
          mac = f'C.le.console_{version}_aarch64.app.tar.gz'
          base = f'https://github.com/{repo}/releases/download/{tag}/'
          manifest = {
              'version': version,
              'notes': f'C.le.控制台 {version}：Windows 与 Apple Silicon 自动更新。',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64': {'signature': asset(win + '.sig').read_text().strip(), 'url': base + urllib.parse.quote(win)},
                  'darwin-aarch64': {'signature': asset(mac + '.sig').read_text().strip(), 'url': base + urllib.parse.quote(mac)},
              },
          }
          (root / 'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          cat release-assets/latest.json

      - name: Create GitHub Release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "C.le.控制台 $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release edit "$GITHUB_REF_NAME" --title "C.le.控制台 $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

      - name: Verify published updater manifest
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$URL" -o published-latest.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          data = json.load(open('published-latest.json', encoding='utf-8'))
          assert set(data['platforms']) == {'windows-x86_64', 'darwin-aarch64'}
          assert all(item['signature'] and item['url'].startswith('https://') for item in data['platforms'].values())
          print('published updater manifest verified:', data['version'])
          PY
