name: Apply updater integration patch

on:
  push:
    branches:
      - feature/windows-update-notifier
    paths:
      - .github/workflows/apply-updater-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feature/windows-update-notifier
          fetch-depth: 0

      - name: Patch Tauri builder
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'mod commands;\n',
                  'mod commands;\nmod app_updates;\n',
                  'module declaration',
              ),
              (
                  '        .plugin(tauri_plugin_shell::init())\n',
                  '        .plugin(tauri_plugin_shell::init())\n        .plugin(tauri_plugin_updater::Builder::new().build())\n',
                  'updater plugin registration',
              ),
              (
                  '        .invoke_handler(tauri::generate_handler![\n            // Account Commands\n',
                  '        .invoke_handler(tauri::generate_handler![\n            app_updates::install_app_update,\n            // Account Commands\n',
                  'updater command registration',
              ),
          ]

          changed = False
          for old, new, label in replacements:
              if new in source:
                  print(f'{label}: already applied')
                  continue
              if old not in source:
                  raise SystemExit(f'Could not find anchor for {label}')
              source = source.replace(old, new, 1)
              changed = True
              print(f'{label}: applied')

          if changed:
              path.write_text(source, encoding='utf-8')

      - name: Resolve Cargo lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null

      - name: Commit generated integration changes
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/lib.rs Cargo.lock
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: register signed updater runtime"
          git push origin HEAD:feature/windows-update-notifier
